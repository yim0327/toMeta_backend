spring:
  application:
    name: tometa

  task:
    scheduling:
      pool:
        size: 2

  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  anonymous-session:
    expiration-days: 60
    cookie-secure: ${COOKIE_SECURE:true}

  storage:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
      presigned-upload-expiration-minutes: 10
      presigned-download-expiration-minutes: 60
      max-upload-size-bytes: 10485760
      orphan-cleanup:
        retention: 24h
        batch-size: 500
        cron: "0 0 * * * *"
        zone: Asia/Seoul

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5-mini}

  firebase:
    enabled: ${FIREBASE_ENABLED:false}

  report:
    scheduler:
      daily-generation-cron: "0 15 00 * * *"
      weekly-generation-cron: "0 0 0 * * MON"
      weekly-notification-cron: "0 * * * * MON"
      weekly-notification-recovery-cron: "0 * * * * *"

  notification:
    scheduler:
      record-reminder-cron: "0 * * * * *"